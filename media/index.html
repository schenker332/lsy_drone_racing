<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autonomous Drone Racing — Videos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 40px 24px;
    }

    .video-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      width: 100%;
      max-width: 860px;
    }

    .video-card h2 {
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      color: #8b949e;
      border-bottom: 1px solid #21262d;
    }

    .video-card video {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <div class="video-card">
    <h2>Simulation</h2>
    <video src="https://raw.githubusercontent.com/schenker332/lsy_drone_racing/main/media/Sim.mov" controls></video>
  </div>

  <div class="video-card">
    <h2>Real-World Flight</h2>
    <video src="https://raw.githubusercontent.com/schenker332/lsy_drone_racing/main/media/Flight.mp4" controls></video>
  </div>

</body>
</html>
