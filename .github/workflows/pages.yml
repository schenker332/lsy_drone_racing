name: Deploy project page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare pages content
        run: |
          mkdir pages_content
          cp media/index.html pages_content/
          cp media/sim.html pages_content/
          cp media/flight.html pages_content/
          cp media/*.png pages_content/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages_content

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
